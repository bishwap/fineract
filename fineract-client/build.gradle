description = 'Fineract Client'

apply plugin: 'org.openapi.generator'

apply from: 'dependencies.gradle'

// TODO: @vidakovic we should publish this lib to Maven Central; do in separate PR

openApiMeta {
    generatorName = 'Fineract'
    packageName = 'org.apache.fineract.client'
    outputFolder = "$buildDir/meta".toString()
}

openApiValidate {
    inputSpec = "$swaggerFile"
    recommend = true
}

task buildJavaSdk(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask){
    generatorName = 'java'
    verbose = false
    validateSpec = false
    skipValidateSpec = true
    inputSpec = "$swaggerFile"
    outputDir = "$buildDir/generated/java".toString()
    groupId = 'org.apache.fineract'
    apiPackage = 'org.apache.fineract.client.services'
    invokerPackage = 'org.apache.fineract.client'
    modelPackage = 'org.apache.fineract.client.models'
    configOptions = [
        dateLibrary: 'java8',
        useRxJava2: 'false',
        library: 'retrofit2',
        hideGenerationTimestamp: 'true',
        // Emit jakarta.* (e.g. jakarta.annotation.Generated) instead of javax.*; javax.annotation.Generated
        // was removed from the JDK and the module is now on Java 21 / Jakarta. See UPGRADE-JAVA21-NOTES.md Phase 8.
        useJakartaEe: 'true',
    ]
    generateModelTests = false
    generateApiTests = false
    ignoreFileOverride = "$projectDir/.openapi-generator-ignore"
    // trick to make sure fineract.yaml is generated first. Under Gradle 8's strict validation the
    // producers of $swaggerFile (the Swagger 'resolve' task and processResources, which both write into
    // fineract-provider/build/classes/java/main) must be declared explicitly. See NOTES Phase 8.
    dependsOn = [
        ':fineract-provider:compileJava',
        ':fineract-provider:resolve',
        ':fineract-provider:processResources'
    ]
    finalizedBy = [licenseFormat]
}

task buildTypescriptAngularSdk(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask){
    generatorName = 'typescript-angular'
    verbose = false
    validateSpec = false
    skipValidateSpec = true
    inputSpec = "$swaggerFile"
    outputDir = "$buildDir/generated/typescript".toString()
    apiPackage = 'org.apache.fineract.client.services'
    invokerPackage = 'org.apache.fineract.client'
    modelPackage = 'org.apache.fineract.client.models'
    configOptions = [
        apiModulePrefix: 'fineract',
        configurationPrefix: 'fineract',
        ngVersion: '10.0.0',
        npmName: 'apache-fineract-client'
    ]
    dependsOn = [
        ':fineract-provider:compileJava',
        ':fineract-provider:resolve',
        ':fineract-provider:processResources'
    ]
    finalizedBy = [licenseFormat]
}

// TODO: @vidakovic we could provide even more client libs in different languages (Go, Ruby, Swift etc.)
compileJava.dependsOn buildJavaSdk, spotlessJavaApply, buildTypescriptAngularSdk, spotlessMiscApply

sourceSets {
    generated {
        java {
            srcDir "$buildDir/generated/java/src/main/java"
        }
    }
}

// The license plugin auto-creates license/licenseFormat tasks for the 'generated' sourceSet, which read
// buildJavaSdk's output. Declare the dependency explicitly for Gradle 8's strict validation. See NOTES Phase 8.
tasks.matching { it.name == 'licenseGenerated' || it.name == 'licenseFormatGenerated' }.configureEach {
    dependsOn buildJavaSdk
}

java {
    // FINERACT-1214 previously pinned this module to Java 8. Per the supervised Java 21 "full
    // migration" decision this override is lifted and the module is raised to Java 21 to match the
    // rest of the build. See UPGRADE-JAVA21-NOTES.md Phase 1.
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

compileJava {
    source += sourceSets.generated.java
}

tasks.withType(JavaCompile) {
    // the generated code in build/generated/java/src/main/java/org/apache/fineract/client/auth/OAuthOkHttpClient.java#L71 currently uses deprecated RequestBody.create(MediaType,String)
    // TODO FINERACT-1247 why does this not work:
    //   options.compilerArgs -= ["-Xlint:deprecation"]
    //   options.compilerArgs += ["-Xlint:-deprecation"]
    // So we just have to use:
    options.compilerArgs -= ["-Werror"]
}

configurations {
    generatedCompile.extendsFrom implementation
    generatedRuntime.extendsFrom runtime
}

test {
    useJUnitPlatform()
}
