# Full always-on demo stack: MySQL + Fineract (with the seeded FD defect) +
# relay + banking console + Caddy (public HTTPS).
#
# Run from the repo root:
#   docker compose -f demo/dynatrace-devin-relay/deploy/docker-compose.demo.yml --env-file demo/dynatrace-devin-relay/deploy/.env.deploy up -d --build
#
# The banking console is served publicly by Caddy on ${DOMAIN} (auto-HTTPS) or
# on http://<vm-ip> when DOMAIN is left blank.

services:
  fineractmysql:
    image: mysql:5.7
    volumes:
      - ../../../fineract-db/docker:/docker-entrypoint-initdb.d:Z,ro
      - fineract-mysql-data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: skdcnwauicn2ucnaecasdsajdnizucawencascdca
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "--password=skdcnwauicn2ucnaecasdsajdnizucawencascdca"]
      timeout: 10s
      retries: 20

  fineract-server:
    build:
      context: ../../..
      dockerfile: demo/dynatrace-devin-relay/deploy/fineract.Dockerfile
      target: fineract
    restart: always
    depends_on:
      - fineractmysql
    environment:
      - DRIVERCLASS_NAME=org.drizzle.jdbc.DrizzleDriver
      - PROTOCOL=jdbc
      - SUB_PROTOCOL=mysql:thin
      - fineract_tenants_driver=org.drizzle.jdbc.DrizzleDriver
      - fineract_tenants_url=jdbc:mysql:thin://fineractmysql:3306/fineract_tenants
      - fineract_tenants_uid=root
      - fineract_tenants_pwd=skdcnwauicn2ucnaecasdsajdnizucawencascdca
      - FINERACT_DEFAULT_TENANTDB_HOSTNAME=fineractmysql
      - FINERACT_DEFAULT_TENANTDB_PORT=3306
      - FINERACT_DEFAULT_TENANTDB_UID=root
      - FINERACT_DEFAULT_TENANTDB_PWD=skdcnwauicn2ucnaecasdsajdnizucawencascdca
      - FINERACT_DEFAULT_TENANTDB_CONN_PARAMS=

  relay:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    command: ["node", "server.js"]
    environment:
      - PORT=3000
      - DEVIN_API_BASE=${DEVIN_API_BASE:-https://api.devin.ai}
      - DEVIN_API_TOKEN=${DEVIN_API_TOKEN}
      - REPO_URL=${REPO_URL:-https://github.com/bishwap/fineract}
      - TARGET_REPO_REF=${TARGET_REPO_REF:-devin/1785460004-fd-dynatrace-demo}
      - DRY_RUN=${DRY_RUN:-0}

  console:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - fineract-server
      - relay
    environment:
      - DEMO_PORT=4000
      - BASE_URL=https://fineract-server:8443
      - FIRE_COUNT=${FIRE_COUNT:-1}
      - FD_CLIENT_ID=${FD_CLIENT_ID:-226}
      - FD_PRODUCT_ID=${FD_PRODUCT_ID:-223}
      - RELAY_URL=http://relay:3000
      - DT_ENVIRONMENT=${DT_ENVIRONMENT}
      - DT_DQL_TOKEN=${DT_DQL_TOKEN}
      - DT_ENTITY=${DT_ENTITY}
      - FAIL_ENDPOINT=${FAIL_ENDPOINT:-submitApplication}
      - BANK_NAME=${BANK_NAME:-Meridian Bank}
      - RUM_TAG=${RUM_TAG:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=0

  caddy:
    image: caddy:2
    restart: always
    depends_on:
      - console
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  fineract-mysql-data:
  caddy-data:
  caddy-config:
