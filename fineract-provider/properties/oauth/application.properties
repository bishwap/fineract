spring.profiles.default=basicauth
spring.profiles.active=oauth
management.health.jms.enabled=false

# Spring Boot 2.6+ prohibits bean circular references by default. Fineract has a few legacy
# cycles (e.g. jobRegisterService <-> schedulerStopListener). Re-allow them for this Java 21
# baseline hop; breaking the cycles is deferred (see PR notes).
spring.main.allow-circular-references=true

# FINERACT-883
management.info.git.mode=FULL

# FINERACT-914
server.forward-headers-strategy=framework
spring.cache.jcache.config=classpath:/META-INF/spring/ehcache.xml
