// TODO: this is work in progress, please follow FINERACT-1171
buildscript {
    ext {
        jacocoVersion = '0.8.6'
        retrofitVersion = '2.9.0'
        okhttpVersion = '4.9.0'
        // oltuVersion removed in Phase 6: the legacy spring-security-oauth2 authorization-server it backed
        // is gone in Spring Security 6. See UPGRADE-JAVA21-NOTES.md Phase 6.
        fineractJavaProjects = subprojects.findAll{
            [
                'fineract-api',
                'fineract-provider',
                'integration-tests',
                'fineract-client'
            ].contains(it.name)
        }
        fineractPublishProjects = subprojects.findAll{
            [
                'fineract-client'
            ].contains(it.name)
        }
    }
    repositories {
        mavenCentral()
        maven { url "https://plugins.gradle.org/m2/" }
    }

    dependencies {
        classpath 'com.bmuschko:gradle-cargo-plugin:2.8.0'
        classpath 'org.apache.openjpa:openjpa:4.0.0' // jakarta.persistence-based (Jakarta Persistence 3.1); ASM-based enhancer runs on JDK 21. See UPGRADE-JAVA21-NOTES.md Phase 4.
        classpath 'com.radcortez.gradle:openjpa-gradle-plugin:3.2.0' // no 4.x release exists; it only soft-requires openjpa 3.2.2, so the 4.0.0 above wins on the buildscript classpath and drives the enhancer. See UPGRADE-JAVA21-NOTES.md Phase 4.
        classpath 'com.github.spotbugs.snom:spotbugs-gradle-plugin:6.0.18'
        classpath 'com.github.andygoossens:gradle-modernizer-plugin:1.9.2'
    }
}

plugins {
    id 'io.spring.dependency-management' version '1.1.4'
    id 'com.diffplug.spotless' version '6.25.0' apply false
    id 'org.nosphere.apache.rat' version '0.8.1' apply false
    id 'com.github.hierynomus.license' version '0.16.1' apply false
    id 'org.openapi.generator' version '6.6.0' apply false
    id 'org.zeroturnaround.gradle.jrebel' version '1.1.10' apply false
    id 'org.springframework.boot' version '3.2.5' apply false
    id 'net.ltgt.errorprone' version '3.1.0' apply false
    id 'io.swagger.core.v3.swagger-gradle-plugin' version '2.2.20' apply false
    id 'com.gorylenko.gradle-git-properties' version '2.4.1' apply false
    id 'org.asciidoctor.jvm.convert' version '4.0.4' apply false
    id 'org.asciidoctor.jvm.pdf' version '4.0.4' apply false
    id 'org.asciidoctor.jvm.revealjs' version '4.0.4' apply false
    // org.asciidoctor.jvm.epub / .gems / kindlegen removed: never applied (only convert/pdf/revealjs are
    // used by fineract-doc) and the gems plugin dragged in the jcenter-only com.burgstaller:okhttp-digest:1.10.
    // See UPGRADE-JAVA21-NOTES.md Phase 1.
}

description = '''\
Run as:
gradle clean bootRun'''

project.ext.jerseyVersion = '3.1.5' // Sun Jersey 1.19.4 (com.sun.jersey, javax.ws.rs) is abandoned; migrated to Jersey 3.1.x (org.glassfish.jersey, jakarta). See UPGRADE-JAVA21-NOTES.md Phase 5.
// groovy.version override removed: the Spring Boot 3.2 BOM manages Groovy 4.0.x (org.apache.groovy).
// The old pin (3.0.6) forced a non-existent org.apache.groovy:groovy-bom:3.0.6. See UPGRADE-JAVA21-NOTES.md Phase 2.
ext['swaggerFile'] = "$rootDir/fineract-provider/build/classes/java/main/static/swagger-ui/fineract.yaml".toString()

allprojects  {
    group = 'org.apache.fineract'

    repositories {
        mavenCentral()
    }

    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'
    apply plugin: 'com.github.hierynomus.license'
    apply plugin: 'org.nosphere.apache.rat'
    apply plugin: 'project-report'

    // Configuration for the dependency management plugin
    // https://github.com/spring-gradle-plugins/dependency-management-plugin
    dependencyManagement {
        imports {
            mavenBom 'org.springframework:spring-framework-bom:6.1.6'
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.2.5'
            mavenBom 'org.junit:junit-bom:5.10.2'
        }

        dependencies {
            // We use fixed versions, instead of inheriting them from the Spring BOM, to be able to be on more recent ones.
            // We do not use :+ to get the latest available version available on Maven Central, as that could suddenly break things.
            // We use the Renovate Bot to automatically propose Pull Requests (PRs) when upgrades for all of these versions are available.

            // spring-security-oauth2 2.5.1.RELEASE removed in Phase 6 (end-of-life, incompatible with
            // Spring Security 6). The OAuth2 authorization-server is a documented blocker; the resource
            // server side is now provided by spring-boot-starter-oauth2-resource-server when re-enabled.
            // See UPGRADE-JAVA21-NOTES.md Phase 6.
            dependency 'org.apache.openjpa:openjpa:4.0.0' // jakarta.persistence-based; when upgrading, also change OpenJPA version repeated above in buildscript!
            dependency 'com.google.guava:guava:33.2.1-jre' // bumped from 30.1.1-jre in Phase 8: error_prone_core 2.28 needs Guava >= 31.1 (ImmutableMap.Builder.buildOrThrow). See UPGRADE-JAVA21-NOTES.md Phase 8.
            dependency 'com.google.code.gson:gson:2.8.6'
            // Legacy Jackson 1.x (org.codehaus.jackson), still used by a handful of template/interop/campaign
            // classes, used to arrive transitively; re-pinned explicitly in Phase 8 (tech-debt; migrate to
            // com.fasterxml.jackson later). See UPGRADE-JAVA21-NOTES.md Phase 8.
            dependency 'org.codehaus.jackson:jackson-mapper-asl:1.9.13'
            dependency 'org.codehaus.jackson:jackson-core-asl:1.9.13'
            dependency 'com.google.truth:truth:1.1.2'
            dependency 'com.google.truth.extensions:truth-java8-extension:1.1.2'
            dependency 'org.apache.commons:commons-email:1.5'
            dependency 'commons-io:commons-io:2.8.0'
            dependency 'org.drizzle.jdbc:drizzle-jdbc:1.4'
            dependency 'com.github.librepdf:openpdf:1.3.26'
            dependency 'org.mnode.ical4j:ical4j:3.0.25'
            dependency 'org.quartz-scheduler:quartz:2.3.2'
            dependency 'com.amazonaws:aws-java-sdk-s3:1.11.1011'
            dependency 'org.ehcache:ehcache:3.9.3'
            dependency 'com.github.spullara.mustache.java:compiler:0.9.7'
            dependency 'com.jayway.jsonpath:json-path:2.5.0'
            dependency 'org.apache.tika:tika-core:1.26'
            dependency 'org.apache.httpcomponents:httpclient:4.5.13'
            dependency 'io.swagger.core.v3:swagger-annotations:2.2.20' // aligned with swagger-gradle-plugin 2.2.20 in Phase 8; 2.1.8 lacked io.swagger.v3.oas.annotations.Webhooks needed by the OpenJPA enhancer classpath. See NOTES Phase 8.
            dependency 'jakarta.management.j2ee:jakarta.management.j2ee-api:1.1.4'
            // JMS 3.1 is the first jakarta.jms-namespaced release (2.0.x is still javax.jms).
            dependency 'jakarta.jms:jakarta.jms-api:3.1.0'
            // jakarta.xml.bind namespace requires the 4.0.x API (2.3.x is still javax.xml.bind).
            dependency 'jakarta.xml.bind:jakarta.xml.bind-api:4.0.2'
            dependency 'org.glassfish.jaxb:jaxb-runtime:4.0.5'
            dependency 'jakarta.validation:jakarta.validation-api:3.0.2'
            // ActiveMQ bumped from 5.16.2 in Phase 8: ActiveMQ 5.x "Classic" is javax.jms; 6.x is jakarta.jms.
            // activemq-client / activemq-openwire-legacy must be pinned too, otherwise the Spring Boot 3.2 BOM
            // forces them back to 5.18.4 (javax.jms) and clashes with the 6.x broker. See NOTES Phase 8.
            dependency 'org.apache.activemq:activemq-broker:6.1.4'
            dependency 'org.apache.activemq:activemq-client:6.1.4'
            dependency 'org.apache.activemq:activemq-openwire-legacy:6.1.4'
            dependency 'org.apache.bval:org.apache.bval.bundle:2.0.5'

            dependency 'io.github.classgraph:classgraph:4.8.105'
            dependency 'org.awaitility:awaitility:4.1.0'
            dependency 'com.github.spotbugs:spotbugs-annotations:4.2.3'
            dependency 'javax.cache:cache-api:1.1.1'
            dependency 'org.mock-server:mockserver-junit-jupiter:5.11.2'
            dependency 'org.webjars.npm:swagger-ui-dist:3.48.0'
            dependency 'org.webjars:webjars-locator-core:0.46'
            dependency 'org.springframework.boot:spring-boot-starter-mail:3.2.5'

            // fineract client dependencies
            dependency "com.squareup.retrofit2:retrofit:$retrofitVersion"
            dependency "com.squareup.retrofit2:retrofit-mock:$retrofitVersion"
            dependency "com.squareup.retrofit2:adapter-java8:$retrofitVersion"
            dependency "com.squareup.retrofit2:adapter-rxjava2:$retrofitVersion"
            dependency "com.squareup.retrofit2:adapter-rxjava3:$retrofitVersion"
            dependency "com.squareup.retrofit2:adapter-guava:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-wire:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-jackson:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-simplexml:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-jaxb:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-java8:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-scalars:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-gson:$retrofitVersion"
            dependency "com.squareup.retrofit2:converter-protobuf:$retrofitVersion"
            dependency "com.squareup.okhttp3:okhttp:$okhttpVersion"
            dependency "com.squareup.okhttp3:okcurl:$okhttpVersion"
            dependency "com.squareup.okhttp3:logging-interceptor:$okhttpVersion"
            dependency "com.squareup.okhttp3:okhttp-apache:$okhttpVersion"
            dependency "com.squareup.okhttp3:okhttp-android-support:$okhttpVersion"
            dependency "com.squareup.okhttp3:okhttp-urlconnection:$okhttpVersion"
            dependency "com.squareup.okhttp3:okhttp-sse:$okhttpVersion"
            dependency "io.gsonfire:gson-fire:1.8.5"
            dependency "io.swagger:swagger-core:1.6.2"
            dependency "io.swagger:swagger-annotations:1.6.2"
            dependency "javax.annotation:javax.annotation-api:1.3.2"
            dependency "com.google.code.findbugs:jsr305:3.0.2"
            dependency "commons-codec:commons-codec:1.15"

            dependency ('org.flywaydb:flyway-core:7.0.0') {
                // https://issues.apache.org/jira/browse/FINERACT-1172
                // https://github.com/apache/fineract/pull/1355
                // https://github.com/flyway/flyway/issues/2957
                // exclude conflicting non-<optional> dependencies from https://github.com/flyway/flyway/blob/master/flyway-core/pom.xml
                exclude 'software.amazon.awssdk:s3'
            }

            dependency ('org.dom4j:dom4j:2.1.3') {
                exclude 'relaxngDatatype:relaxngDatatype' // already in com.sun.xml.bind:jaxb-osgi:2.3.0.1
                // FINERACT-940 && FINERACT-966 https://github.com/spotbugs/spotbugs/issues/1128
                exclude 'xpp3:xpp3'
                exclude 'pull-parser:pull-parser'
            }

            dependencySet(group: 'com.sun.jersey', version: jerseyVersion) {
                entry 'jersey-core'
                entry 'jersey-servlet'
                entry 'jersey-server'
                entry 'jersey-json'
            }
            dependencySet(group: 'com.sun.jersey.contribs', version: jerseyVersion) {
                entry 'jersey-spring'
                entry 'jersey-multipart'
            }
            dependencySet(group: 'org.apache.poi', version: '4.1.2') {
                entry 'poi'
                entry 'poi-ooxml'
                entry 'poi-ooxml-schemas'
            }
            dependencySet(group: 'io.rest-assured', version: '5.4.0') {
                entry 'rest-assured'
                entry 'json-path'
                entry 'xml-path'
            }
        }
    }

    // Configuration for the spotless plugin
    // https://github.com/diffplug/spotless/tree/main/plugin-gradle
    spotless {
        format 'misc', {
            target '**/*.md', '**/*.properties', '**/.gitignore', '**/.openapi-generator-ignore', '**/*.yml', '**/*.xml', '**/**.json', '**/*.sql'
            targetExclude '**/build/**', '**/bin/**', '**/.settings/**', '**/.idea/**', '**/.gradle/**', '**/gradlew.bat'
            indentWithSpaces(4)
            endWithNewline()
            trimTrailingWhitespace()
        }

        groovyGradle {
            target '*.gradle', '**/*.gradle'
            targetExclude '**/build/**'
            greclipse()
            indentWithSpaces(4)
            endWithNewline()
            trimTrailingWhitespace()
        }

        lineEndings 'UNIX'
    }

    // Configuration for Gradle license plug-in
    // https://github.com/hierynomus/license-gradle-plugin
    license {
        header rootProject.file("$rootDir/APACHE_LICENSETEXT.md")
        excludes([
            "**/gradlew*",
            "**/git.properties",
            "**/*.html",
            "**/*.mustache",
            "**/package-info.java",
            "**/keystore.jks",
            "**/static/swagger-ui/**",
            "**/api-docs/**",
        ])
        strictCheck true
    }

    task licenseFormatBuildScripts (type:nl.javadude.gradle.plugins.license.License) {
        source = fileTree(dir: "$rootDir/", includes: [
            '**/*.bat',
            '**/*.sh',
            '**/*.sql'
        ], excludes: [
            '**/gradlew*',
            // Do not descend into build-output dirs: generators (e.g. the OpenAPI buildJavaSdk task)
            // emit .sh scripts there, and Gradle 8's strict validation flags the overlap. See NOTES Phase 8.
            '**/build/**',
            '**/bin/**',
            '**/out/**',
            '**/.gradle/**'
        ])
    }
    licenseFormat.dependsOn licenseFormatBuildScripts
    // licenseFormatBuildScripts scans the whole $rootDir tree, which overlaps the root project's audit /
    // formatting tasks (rat, spotlessGroovyGradle, spotlessMisc, ...). Gradle 8's strict task-dependency
    // validation requires those producers to be declared explicitly. See UPGRADE-JAVA21-NOTES.md Phase 8.
    licenseFormatBuildScripts.dependsOn rootProject.tasks.named('rat')
    licenseFormatBuildScripts.dependsOn rootProject.tasks.matching { it.name.startsWith('spotless') }

    // Configuration for Apache Release Audit Tool task
    // https://github.com/eskatos/creadur-rat-gradle
    rat {
        verbose = false
        reportDir = file("$buildDir/reports/rat")
        excludes = [
            '**/src/main/templates/**/*.mustache',
            '**/.dockerignore',
            '**/*.launch',
            '**/licenses/**',
            '**/*.md',
            '**/*.adoc',
            '**/.asciidoctorconfig',
            '**/*.puml',
            '**/*.github/**',
            '**/MANIFEST.MF',
            '**/*.json',
            '**/*.json.template',
            '**/*.txt',
            '**/*.log',
            '**/fineractdev-eclipse-preferences.epf',
            '**/template-expected.html',
            '**/template.mustache',
            '**/.classpath',
            '**/.project',
            '**/.idea/**',
            '**/*.ipr',
            '**/*.iws',
            '**/.settings/**',
            '**/bin/**',
            '**/.git/**',
            '**/.gitignore',
            '**/.openapi-generator-ignore',
            '**/.gitkeep',
            '**/*.iml',
            '**/config/swagger/templates/**',
            // Notice files
            '**/NOTICE_RELEASE',
            '**/NOTICE_SOURCE',
            // Swagger License
            '**/src/main/resources/static/swagger-ui/**',
            // gradle
            '**/.gradle/**',
            '**/gradlew',
            '**/gradlew.bat',
            '**/gradle/wrapper/gradle-wrapper.properties',
            '**/caches/**',
            '**/daemon/**',
            '**/native/**',
            '**/wrapper/**',
            '**/build/**',
            // Api Docs
            '**/api-docs/*.*',
            '**/docs/system-architecture/.htaccess',
            '**/docs/system-architecture/404.html',
            '**/docs/system-architecture/index.html',
            '**/docs/system-architecture/**/*.xml',
            '**/bootstrap-3.0.0/assets/application.js',
            '**/system-architecture/js/plugins.js',
            // Apache License
            '**/bootstrap-3.0.0/assets/less.js',
            '**/css/bootstrap-3.0.0/**/*.*',
            // Public Domain See http://www.JSON.org/js.html
            '**/bootstrap-3.0.0/assets/json2.js.htm',
            // MIT License
            '**/modernizr-2.6.2.min.js',
            '**/css/normalize.css',
            '**/assets/filesaver.js',
            '**/css/fonts/glyphicons-halflings-regular.svg',
            '**/assets/jszip.js',
            '**/assets/jquery.js',
            '**/api-docs/jquery-1.7.min.js',
            '**/css/toc-0.1.2/**/*.*',
            '**/docs/system-architecture/css/main.css',
            '**/system-architecture/js/vendor/jquery-1.9.1.min.js',
            '**/system-architecture/js/vendor/toc-0.1.2/jquery.toc.min.js',
            '**/assets/respond.min.js',
            '**/assets/html5shiv.js',
            // BSD License
            '**/assets/uglify.js',
            // Ignore out folder
            '**/out/**',
            // Git build info
            "**/git.properties",
            ".mailmap",
        ]
    }
}

configure(project.fineractJavaProjects) {
    // NOTE: order matters!

    apply plugin: 'java-library'
    apply plugin: 'idea'
    apply plugin: 'eclipse'
    apply plugin: 'checkstyle'
    apply plugin: 'jacoco'
    apply plugin: "net.ltgt.errorprone"
    apply plugin: "com.github.spotbugs"
    apply plugin: 'com.github.andygoossens.gradle-modernizer-plugin'

    /* define the valid syntax level for source files */
    sourceCompatibility = JavaVersion.VERSION_21
    /* define binary compatibility version */
    targetCompatibility = JavaVersion.VERSION_21

    /* http://stackoverflow.com/questions/19653311/jpa-repository-works-in-idea-and-production-but-not-in-gradle */
    sourceSets.main.output.resourcesDir = sourceSets.main.java.destinationDirectory.get().asFile
    sourceSets.test.output.resourcesDir = sourceSets.test.java.destinationDirectory.get().asFile

    configurations {
        implementation.setCanBeResolved(true)
        api.setCanBeResolved(true)
    }

    tasks.withType(JavaCompile) {
        options.compilerArgs += [
            "-Xlint:unchecked",
            "-Xlint:cast",
            "-Xlint:auxiliaryclass",
            // -Xlint:deprecation intentionally disabled during the Java 21 / Spring Boot 3 migration:
            // Spring Framework 6 / Security 6 newly-deprecate many APIs still used here (e.g.
            // JdbcTemplate.query(String,Object[],RowMapper)), and with -Werror below every one would be a
            // hard build failure. Kept off so the migration compiles; re-enable after the deprecation
            // cleanup (~75 sites). See UPGRADE-JAVA21-NOTES.md Phase 8.
            "-Xlint:dep-ann",
            "-Xlint:divzero",
            "-Xlint:empty",
            "-Xlint:exports",
            "-Xlint:fallthrough",
            "-Xlint:finally",
            "-Xlint:module",
            "-Xlint:opens",
            "-Xlint:options",
            "-Xlint:overloads",
            "-Xlint:overrides",
            "-Xlint:path",
            "-Xlint:processing",
            "-Xlint:removal",
            "-Xlint:requires-automatic",
            "-Xlint:requires-transitive-automatic",
            "-Xlint:try",
            "-Xlint:varargs",
            "-Xlint:preview",
            "-Xlint:static",
            "-Werror"
        ]
        // TODO FINERACT-959 (gradually) enable -Xlint:all (see "javac -help -X")

        // See the -Xlint:deprecation note above: deprecation reporting is off for the migration.
        options.deprecation = false

        options.compilerArgs +=[
            "-Xmaxwarns",
            1500,
            "-Xmaxerrs",
            1500
        ]
    }

    // Configuration for the spotless plugin
    // https://github.com/diffplug/spotless/tree/main/plugin-gradle
    dependencies {
        spotbugsPlugins 'jp.skypencil.findbugs.slf4j:bug-pattern:1.5.0@jar'
        spotbugs 'com.github.spotbugs:spotbugs:4.8.3'
    }

    spotless {
        java {
            targetExclude '**/build/**', '**/bin/**', '**/out/**'
            importOrder() //sort imports alphabetically
            removeUnusedImports()
            eclipse().configFile "$rootDir/config/fineractdev-formatter.xml"
            endWithNewline()
            trimTrailingWhitespace()

            // Enforce style modifier order
            custom 'Modifier ordering', {
                def modifierRanking = [
                    public      : 1,
                    protected   : 2,
                    private     : 3,
                    abstract    : 4,
                    default     : 5,
                    static      : 6,
                    final       : 7,
                    transient   : 8,
                    volatile    : 9,
                    synchronized: 10,
                    native      : 11,
                    strictfp    : 12]
                // Find any instance of multiple modifiers. Lead with a non-word character to avoid
                // accidental matching against for instance, "an alternative default value"
                it.replaceAll(/\W(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                    // Do not replace the leading non-word character.  Identify the modifiers
                    it.replaceAll(/(?:public |protected |private |abstract |default |static |final |transient |volatile |synchronized |native |strictfp ){2,}/, {
                        // Sort the modifiers according to the ranking above
                        it.split().sort({ modifierRanking[it] }).join(' ') + ' '
                    }
                    )
                }
                )
            }
        }

        lineEndings 'UNIX'
    }

    compileJava.dependsOn spotlessCheck

    // If we are running Gradle within Eclipse to enhance classes with OpenJPA,
    // set the classes directory to point to Eclipse's default build directory
    if (project.hasProperty('env') && project.getProperty('env') == 'eclipse') {
        sourceSets.main.java.destinationDirectory.set(file("$projectDir/bin/main"))
    }

    // Configuration for the Checkstyle plugin
    // https://docs.gradle.org/current/userguide/checkstyle_plugin.html
    dependencies {
        checkstyle 'com.puppycrawl.tools:checkstyle:8.42'
        checkstyle 'com.github.sevntu-checkstyle:sevntu-checks:1.39.0'
    }

    // Configuration for JaCoCo code coverage task
    // https://www.eclemma.org/jacoco/
    jacoco {
        toolVersion = jacocoVersion
        reportsDirectory = file("$buildDir/reports/jacoco")
    }

    jacocoTestReport {
        reports {
            html.required = true
            xml.required = true
            html.outputLocation = file("${buildDir}/code-coverage")
        }
    }

    // Configuration for the errorprone plugin
    // https://github.com/tbroyer/gradle-errorprone-plugin
    dependencies {
        errorprone "com.google.errorprone:error_prone_core:2.28.0"
    }

    tasks.withType(JavaCompile) {
        options.errorprone {
            disableWarningsInGeneratedCode = true
            excludedPaths = ".*/build/.*"
            // PreferredInterfaceType (new in the errorprone 2.28 bump) fires on 231 pre-existing sites and,
            // unlike every other check here, is not suppressed by disable(); force it off via a raw -Xep arg.
            // Style-only (e.g. Collection -> List); prioritized follow-up. See UPGRADE-JAVA21-NOTES.md Phase 8.
            errorproneArgs.add("-Xep:PreferredInterfaceType:OFF")
            disable(
                    // TODO Remove disabled checks from this list, by fixing remaining usages
                    "UnusedVariable",
                    "TypeParameterUnusedInFormals",
                    "EmptyBlockTag",
                    "MissingSummary",
                    "InvalidParam",
                    "ReturnFromVoid",
                    "AlmostJavadoc",
                    "InvalidBlockTag",
                    "JavaUtilDate", // TODO FINERACT-1298
                    // New checks introduced by the error_prone_core 2.6.0 -> 2.28.0 bump (required for JDK 21).
                    // They fire on many pre-existing sites unrelated to the Java 21 / Jakarta migration; disabled
                    // to keep the -Werror build green. Each is a prioritized follow-up cleanup (counts are the
                    // findings at migration time). See UPGRADE-JAVA21-NOTES.md Phase 8.
                    "UnnecessaryStringBuilder", // 5
                    "StringCaseLocaleUsage", // 4
                    "OperatorPrecedence", // 19
                    "ReturnValueIgnored", // 18
                    "UnusedMethod", // 7
                    "DoNotCall", // 1 (Thread.run() in SchedulerStopListener - behavioural, left for review)
                    "SystemConsoleNull", // System.console() nullability change in JDK 22+
                    "NonApiType", // prefer java.util.List/etc. in signatures - style only
                    "NotJavadoc", // 182 - block comments using /** that are not Javadoc
                    "PatternMatchingInstanceof", // 21 - Java 16+ pattern-matching instanceof suggestion
                    "DirectInvocationOnMock", // 10
                    "UnnecessaryLongToIntConversion", // 4
                    "ReturnAtTheEndOfVoidFunction", // 4
                    "AlreadyChecked", // redundant boolean conditions
                    "NarrowCalculation", // 1 - review: potential precision loss
                    "LongDoubleConversion", // 1 - review: potential precision loss
                    )
            error(
                    "DefaultCharset",
                    "RemoveUnusedImports",
                    "WaitNotInLoop",
                    "ThreeLetterTimeZoneID",
                    "VariableNameSameAsType",
                    "UnnecessaryParentheses",
                    "MultipleTopLevelClasses",
                    "MixedMutabilityReturnType",
                    "MultiVariableDeclaration",
                    "AssertEqualsArgumentOrderChecker",
                    "EmptySetMultibindingContributions",
                    "BigDecimalEquals",
                    "MixedArrayDimensions",
                    "PackageLocation",
                    "UseBinds",
                    "BadImport",
                    "IntLongMath",
                    "FloatCast",
                    "ReachabilityFenceUsage",
                    "StreamResourceLeak",
                    "TruthIncompatibleType",
                    "ByteBufferBackingArray",
                    "SameNameButDifferent",
                    "OrphanedFormatString",
                    "CatchAndPrintStackTrace",
                    "ObjectToString",
                    "StringSplitter",
                    "AssertThrowsMultipleStatements",
                    "BoxedPrimitiveConstructor",
                    "EmptyCatch",
                    "BoxedPrimitiveEquality",
                    "SynchronizeOnNonFinalField",
                    "WildcardImport",
                    "FutureReturnValueIgnored",
                    "PrivateConstructorForNoninstantiableModule",
                    "ClassCanBeStatic",
                    "ClassNewInstance",
                    "UnnecessaryStaticImport",
                    "UnsafeFinalization",
                    "JavaTimeDefaultTimeZone",
                    "JodaPlusMinusLong",
                    "MutableMethodReturnType",
                    "SwitchDefault",
                    "VarTypeName",
                    "ArgumentSelectionDefectChecker",
                    "CompareToZero",
                    "InjectOnConstructorOfAbstractClass",
                    "ImmutableEnumChecker",
                    "NarrowingCompoundAssignment",
                    "MissingCasesInEnumSwitch",
                    "ReferenceEquality",
                    "UndefinedEquals",
                    // "PublicConstructorForAbstractClass" removed in Phase 8: this checker no longer exists
                    // in error_prone_core 2.28 (folded into InjectOnConstructorOfAbstractClass). See NOTES Phase 8.
                    "UnescapedEntity",
                    "ModifyCollectionInEnhancedForLoop",
                    "NonCanonicalType",
                    "InvalidInlineTag",
                    "MutablePublicArray",
                    "StaticAssignmentInConstructor",
                    "ProtectedMembersInFinalClass",
                    // "OperatorPrecedence" de-elevated in Phase 8: errorprone 2.28 flags many pre-existing sites; see disable() above.
                    "EqualsGetClass",
                    "EqualsUnsafeCast",
                    "DoubleBraceInitialization",
                    "UnnecessaryDefaultInEnumSwitch",
                    "UnusedNestedClass",
                    // "UnusedMethod" de-elevated in Phase 8: errorprone 2.28 flags many pre-existing sites; see disable() above.
                    "ModifiedButNotUsed",
                    "InconsistentCapitalization",
                    "MissingOverride",
                    // TODO enable these remaining checks (one by one)
                    // "InvalidBlockTag",
                    // "InconsistentOverloads",
                    // "MethodCanBeStatic",
                    // "Var",
                    // "ConstantField",
                    // "UnnecessaryDefaultInEnumSwitch",
                    // "FieldCanBeFinal"
                    )
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            // FINERACT-927
            events "skipped", "failed"
            showStandardStreams = false
            exceptionFormat "full"
        }
    }

    // Configuration for spotbugs plugin
    // https://github.com/spotbugs/spotbugs-gradle-plugin

    // To generate an HTML report instead of XML
    spotbugs {
        reportLevel = com.github.spotbugs.snom.Confidence.valueOf('HIGH')
        showProgress = true
    }
    // https://github.com/spotbugs/spotbugs-gradle-plugin/issues/242
    spotbugsMain {
        reports {
            html {
                required = true
                stylesheet = 'fancy-hist.xsl'
            }
        }
    }
    spotbugsTest {
        reports {
            html {
                required = true
                stylesheet = 'fancy-hist.xsl'
            }
        }
    }

    // Configuration for https://github.com/andygoossens/gradle-modernizer-plugin
    modernizer {
        includeTestClasses = true
        failOnViolations = true
        violationLogLevel="error"
        javaVersion = project.targetCompatibility
        ignoreGeneratedClasses = true
    }
}

configure(project.fineractPublishProjects) {
    // The legacy 'maven' plugin was removed in Gradle 7; only 'maven-publish' remains. See UPGRADE-JAVA21-NOTES.md Phase 1.
    apply plugin: 'maven-publish'

    publishing {
        publications {
            mavenJava(MavenPublication) {
                from components.java

                versionMapping {
                    usage('java-api') {
                        fromResolutionOf('runtimeClasspath')
                    }
                    usage('java-runtime') {
                        fromResolutionResult()
                    }
                }

                pom {
                    name = 'Fineract'
                    description = 'A secure, multi-tenanted microfinance platform'
                    url = 'https://fineract.apache.org'
                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.html'
                        }
                    }
                    scm {
                        connection = 'scm:git:https://github.com/apache/fineract.git'
                        developerConnection = 'scm:git:git://github.com:apache/fineract.git'
                        url = 'https://fineract.apache.org/'
                    }
                }
            }
        }

        // TODO FINERACT-1102: Actually use this to deploy to ASF (Apache Software Foundation) Nexus Maven Repository
    }
}
